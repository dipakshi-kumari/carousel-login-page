<div class="carousel-container" [style.backgroundImage]="'url(' + currentImage + ')'">
  <div class="nav-logo"> 
    <img src="assets/images/cnh-logo2.png" alt="CNH Logo" class="nav-logo">
</div>

<div class="login-wrapper">
  <div class="login-box">
  <h2>Login</h2>
  <label class="input-label">Username</label>
  <form (ngSubmit)="login()">
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="CNH_"
      required
    />
    <label class="input-label">Password</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
    />
    <div class="btn-container">
      <button type="button" class="btn signup-btn">Sign Up</button>
      <button type="submit" class="btn login-btn">Login</button>
    </div>
  </form>
</div>

</div>
</div>
